<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1a12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .chat-container {
            max-width: 820px;
            width: 100%;
            background: #162a1e;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 95vh;
            max-height: 850px;
            border: 1px solid #2d5a3a;
        }
        .chat-header {
            background: linear-gradient(145deg, #0f2a1a, #082012);
            color: #d4edda;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
            border-bottom: 1px solid #2d5a3a;
        }
        .chat-header .logo {
            background: #2d8a4e;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #d4edda;
            font-weight: bold;
        }
        .chat-header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #d4edda;
        }
        .chat-header p {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 2px;
            color: #a8c9b0;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px 20px 8px 20px;
            background: #0f1f16;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 92%;
            padding: 14px 18px;
            border-radius: 20px;
            line-height: 1.8;
            font-size: 15px;
            word-wrap: break-word;
            animation: fadeUp 0.25s ease;
        }
        .message.bot {
            background: #1f3a2a;
            color: #d4edda;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            border: 1px solid #2d5a3a;
        }
        .message.user {
            background: #2d8a4e;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }
        .message h3 {
            font-size: 17px;
            margin: 8px 0 6px 0;
            color: #7ddfa0;
        }
        .message.bot h3 {
            color: #7ddfa0;
        }
        .message h4 {
            font-size: 15px;
            margin: 6px 0 4px 0;
            color: #a8c9b0;
        }
        .message ul, .message ol {
            padding-right: 22px;
            margin: 8px 0;
        }
        .message li {
            margin-bottom: 4px;
        }
        .message .highlight {
            background: #2d4a2a;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 500;
            color: #d4edda;
        }
        .message .note-box {
            background: #1a2e20;
            border-right: 4px solid #2d8a4e;
            padding: 10px 14px;
            border-radius: 8px;
            margin: 8px 0;
        }
        .option-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
            width: 100%;
            align-items: stretch;
        }
        .option-btn {
            background: #1f3a2a;
            border: 1.5px solid #2d5a3a;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            color: #d4edda;
            cursor: pointer;
            transition: all 0.15s;
            text-align: right;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .option-btn:hover {
            background: #2d8a4e;
            border-color: #4aaf6a;
            color: white;
            transform: scale(1.01);
            box-shadow: 0 4px 16px rgba(45, 138, 78, 0.25);
        }
        .option-btn:active {
            transform: scale(0.97);
        }
        .option-btn .emoji {
            font-size: 20px;
        }
        .option-btn .badge-count {
            background: #2d5a3a;
            color: #a8c9b0;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 30px;
            margin-right: auto;
        }
        .chat-footer {
            padding: 12px 20px 16px 20px;
            background: #0f1f16;
            border-top: 1px solid #2d5a3a;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-footer .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .chat-footer input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 30px;
            border: 1.5px solid #2d5a3a;
            background: #1a2e20;
            color: #d4edda;
            font-size: 15px;
            outline: none;
            transition: 0.15s;
        }
        .chat-footer input::placeholder {
            color: #5a7a6a;
        }
        .chat-footer input:focus {
            border-color: #4aaf6a;
            background: #1f3a2a;
        }
        .chat-footer .send-btn {
            background: #2d8a4e;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .chat-footer .send-btn:hover {
            background: #3a9e5e;
            transform: scale(1.02);
        }
        .chat-footer .footer-actions {
            display: flex;
            justify-content: center;
            gap: 16px;
        }
        .btn-reset {
            background: #1f3a2a;
            border: 1px solid #2d5a3a;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            color: #a8c9b0;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-reset:hover {
            background: #2d5a3a;
            color: #d4edda;
        }
        .btn-back {
            background: #1f3a2a;
            border: 1px solid #2d5a3a;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            color: #a8c9b0;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-back:hover {
            background: #2d5a3a;
            color: #d4edda;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f1f16; }
        ::-webkit-scrollbar-thumb { background: #2d5a3a; border-radius: 10px; }
        .typing {
            display: inline-block;
            background: #1f3a2a;
            padding: 12px 20px;
            border-radius: 30px;
            color: #a8c9b0;
            font-size: 14px;
        }
        .typing span {
            display: inline-block;
            animation: dot 1.2s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }
        .badge {
            background: #2d8a4e;
            color: #d4edda;
            font-size: 12px;
            padding: 2px 14px;
            border-radius: 30px;
            font-weight: 600;
            margin-right: 8px;
        }
        .breadcrumb {
            color: #5a7a6a;
            font-size: 12px;
            padding: 4px 0 8px 0;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .breadcrumb span {
            color: #7ddfa0;
        }
        @media (max-width: 600px) {
            .chat-container { height: 100vh; max-height: 100vh; border-radius: 0; padding: 0; }
            .chat-header { padding: 14px 16px; }
            .chat-header h1 { font-size: 17px; }
            .message { font-size: 14px; max-width: 95%; }
            .option-btn { font-size: 14px; padding: 10px 14px; }
        }
    </style>
</head>

                ]

                options: [

    // Answer contents mapping (short summaries — full HTML content for detailed
    // answers should be filled in by whoever maintains the FAQ). We keep the
    // navigation working out of the box; leaf clicks display a fallback message.

    let historyStack = [];
    let currentLayer = 1;
    const chatMessages = document.getElementById('chatMessages');

    function addMessage(text, sender = 'bot') {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        if (text.includes('<') && text.includes('>')) {
            div.innerHTML = text;
        } else {
            div.textContent = text;
        }
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addOptions(options, handler) {
        const container = document.createElement('div');
        container.className = 'option-list';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span class="emoji">•</span> ${opt.label}`;
            btn.onclick = () => handler(opt.id);
            container.appendChild(btn);
        });
        const div = document.createElement('div');
        div.className = 'message bot';
        div.appendChild(container);
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showFinalAnswer(answerId) {
        const answer = DB.answers[answerId];
        if (answer) {
            addMessage(answer, 'bot');
        } else {
            addMessage('پاسخ کامل این مورد به‌زودی افزوده می‌شود. برای اطلاعات بیشتر با شعبه تماس بگیرید یا از منوی اصلی گزینه دیگری را انتخاب کنید.', 'bot');
        }
    }

    function showLayer(categoryId) {
        if (categoryId === 'main') {
            chatMessages.innerHTML = '';
            historyStack = [];
            currentLayer = 1;
            addMessage('به مشاور بانکی کشاورزی خوش آمدید. لطفاً موضوع مورد نظر خود را انتخاب کنید:', 'bot');
            addOptions(DB.mainCategories.map(c => ({ id: c.id, label: c.label })), (id) => {
                historyStack.push(id);
                currentLayer = 2;
                showLayer(id);
            });
            return;
        }

        const layer2 = DB.layer2[categoryId];
        if (layer2) {
            addMessage(layer2.question, 'bot');
            addOptions(layer2.options.map(c => ({ id: c.id, label: c.label })), (id) => {
                historyStack.push(id);
                currentLayer = 3;
                showLayer(id);
            });
            return;
        }

        const layer3 = DB.layer3[categoryId];
        if (layer3) {
            addMessage(layer3.question, 'bot');
            addOptions(layer3.options.map(c => ({ id: c.id, label: c.label })), (id) => {
                historyStack.push(id);
                currentLayer = 4;
                showFinalAnswer(id);
            });
            return;
        }

        resetChat();
    }

    function startChat() {
        chatMessages.innerHTML = '';
        historyStack = [];
        currentLayer = 1;
        showLayer('main');
    }

    function goBack() {
        if (historyStack.length === 0) {
            resetChat();
            return;
        }
        const messages = chatMessages.querySelectorAll('.message, .breadcrumb');
        let removed = 0;
        for (let i = messages.length - 1; i >= 0 && removed < 6; i--) {
            const el = messages[i];
            if (el && el.parentNode) {
                el.remove();
                removed++;
            }
        }
        historyStack.pop();
        currentLayer = Math.max(1, currentLayer - 1);
        if (historyStack.length === 0) {
            startChat();
            return;
        }
        const lastId = historyStack[historyStack.length - 1];
        if (DB.layer2[lastId] || DB.layer3[lastId] || DB.mainCategories.some(c => c.id === lastId)) {
            showLayer(lastId);
            return;
        }
        startChat();
    }

    function handleUserInput() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        addMessage(text, 'user');
        addMessage('برای پاسخ دقیق‌تر لطفاً از منوی گزینه‌های موجود استفاده کنید.', 'bot');
    }

    function resetChat() {
        startChat();
    }

    startChat();
</script>
